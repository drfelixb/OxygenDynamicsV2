name: MATLAB CI

on:
  push:
    branches:
      - main
      - development
      - development-existing-analysis-v3
      - "migration/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matlab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Portable BOI checks (Linux R2025b)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: >
            Image_Processing_Toolbox
            Statistics_and_Machine_Learning_Toolbox

      - name: Record tested commit
        run: git rev-parse HEAD

      - name: Run portable BOI checks
        uses: matlab-actions/run-command@v3
        with:
          command: runBOISoftwareChecks('portable','ci-results')

      - name: Upload BOI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boi-linux-r2025b-${{ github.sha }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 14
