name: Feature request
description: Propose a focused improvement or new capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Research or workflow need
      description: What problem should this change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: scientific
    attributes:
      label: Scientific impact
      description: >-
        State whether detection, quantification, metric definitions,
        comparability, or interpretation could change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: validation
    attributes:
      label: Suggested validation
      description: Describe synthetic tests, regression data, or manual review needed.
