  <rect class="st11" x="420" y="755" width="300" height="92"/>
  <text class="st4" transform="translate(442 780)"><tspan x="0" y="0">Event-specific hypoxic metrics</tspan></text>
  <text class="st2" transform="translate(442 802)"><tspan x="0" y="0">Reconstruct true individual events</tspan></text>
  <text class="st2" transform="translate(442 820)"><tspan x="0" y="0">from event table + binary sink masks</tspan></text>
  <text class="st2" transform="translate(442 838)"><tspan x="0" y="0">Event area, amplitude, duration</tspan></text>
  <rect class="st11" x="790" y="755" width="335" height="92"/>
  <text class="st4" transform="translate(812 780)"><tspan x="0" y="0">Per-event burden</tspan></text>
  <text class="st1" transform="translate(812 802)"><tspan x="0" y="0">Amplitude = MeanOxySinkEvent_NormAmp * -1</tspan></text>
  <text class="st1" transform="translate(812 820)"><tspan x="0" y="0">Contribution = amplitude * area * duration</tspan></text>
  <text class="st2" transform="translate(812 838)"><tspan x="0" y="0">Preferred area: true event-specific Area_um</tspan></text>
  <rect class="st11" x="1195" y="755" width="250" height="92"/>
  <text class="st4" transform="translate(1217 780)"><tspan x="0" y="0">Recording and group burden</tspan></text>
  <text class="st1" transform="translate(1217 802)"><tspan x="0" y="0">HypoxicBurden = sum(contributions)</tspan></text>
  <text class="st2" transform="translate(1217 820)"><tspan x="0" y="0">Summed per recording/FOV</tspan></text>
  <text class="st2" transform="translate(1217 838)"><tspan x="0" y="0">Grouped by metadata columns</tspan></text>
  <rect class="st11" x="1510" y="755" width="210" height="92"/>
  <text class="st4" transform="translate(1532 780)"><tspan x="0" y="0">Area-normalized counts</tspan></text>
  <text class="st1" transform="translate(1532 802)"><tspan x="0" y="0">FOVedge = sqrt(area)</tspan></text>
  <text class="st1" transform="translate(1532 820)"><tspan x="0" y="0">kappa = 1000 / FOVedge</tspan></text>
  <text class="st1" transform="translate(1532 838)"><tspan x="0" y="0">per1mm2 = count * kappa^2</tspan></text>
